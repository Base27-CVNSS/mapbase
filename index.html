<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2745" />
  <title>Vietflex Basemap | PMTiles WebGIS</title>
  <meta name="description" content="Vietflex Basemap: PMTiles trên Cloudflare R2, HTTP Range Request và MapLibre GL JS." />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.13.0/dist/maplibre-gl.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="./styles.css?v=3" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Bản đồ nền Vietflex"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">VF</span>
        <div>
          <strong>VIETFLEX BASEMAP</strong>
          <small>PMTiles · Cloudflare R2 · MapLibre</small>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="sourceState" class="status" data-state="loading">Đang kiểm tra PMTiles</span>
        <button id="fitBtn" type="button" title="Về toàn vùng Việt Nam và Biển Đông">Toàn vùng</button>
      </div>
    </header>

    <section class="info-panel" aria-live="polite">
      <div><span>Zoom</span><strong id="zoomValue">—</strong></div>
      <div><span>Chế độ</span><strong id="zoomMode">—</strong></div>
      <div><span>Tọa độ</span><strong id="coordValue">—</strong></div>
    </section>

    <aside id="errorPanel" class="error-panel" hidden>
      <strong id="errorTitle">Không đọc được PMTiles</strong>
      <p id="errorMessage"></p>
      <p id="errorHint">Kiểm tra object trên R2 và CORS/HTTP Range Request.</p>
    </aside>

    <footer class="attribution-custom">
      Vietflex Basemap · tile thật đến Z11 · Z12+ overzoom
    </footer>
  </main>

  <script>
    window.addEventListener("error", function (event) {
      const panel = document.getElementById("errorPanel");
      const message = document.getElementById("errorMessage");
      const state = document.getElementById("sourceState");
      if (!panel || !message || !state) return;
      panel.hidden = false;
      message.textContent = event.message || "Lỗi JavaScript khi khởi tạo WebGIS.";
      state.dataset.state = "error";
      state.textContent = "Lỗi khởi tạo";
    });
  </script>

  <!-- Pin về MapLibre 5.13.0: phiên bản đang được ví dụ chính thức PMTiles 4.5.0 sử dụng. -->
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.13.0/dist/maplibre-gl.js"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"
          crossorigin="anonymous"></script>
  <script src="./config.js?v=3"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
